[project]
name = "vaultscan"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml", "pandas", "pyarrow", "duckdb", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[project.scripts]
vaultscan = "vaultscan.cli:main"

[tool.setuptools.packages.find]
include = ["vaultscan*"]

[tool.setuptools.package-data]
vaultscan = ["export/template.html"]
