name: report

# Re-run build -> analyze -> export on an existing snapshot without refetching,
# e.g. after changing the analysis code. Uses the raw snapshot artifact of a
# nightly-snapshot run (default: the latest successful one).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "nightly-snapshot run ID to use (blank = latest successful)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly-snapshot
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Offline tests
        run: pytest -q

      - name: Find snapshot run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow nightly.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$RUN_ID" ] || { echo "no successful nightly-snapshot run found"; exit 1; }
          NAME=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
                   -q '[.artifacts[] | select(.name | startswith("snapshot-"))][0].name')
          [ -n "$NAME" ] || { echo "run $RUN_ID has no snapshot artifact (expired?)"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "date=${NAME#snapshot-}" >> "$GITHUB_OUTPUT"

      - name: Download raw snapshot
        uses: actions/download-artifact@v4
        with:
          name: snapshot-${{ steps.src.outputs.date }}
          path: data/snapshots/${{ steps.src.outputs.date }}
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      # Closed-vault details live in the nightly job's cache, not in the artifact.
      - name: Restore closed-vault cache
        uses: actions/cache/restore@v4
        with:
          path: data/closed_vaults
          key: closed-vaults-${{ steps.src.outputs.run_id }}
          restore-keys: closed-vaults-

      - name: Build, analyze, export
        run: vaultscan report --date ${{ steps.src.outputs.date }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.src.outputs.date }}
          path: reports/${{ steps.src.outputs.date }}
          retention-days: 90
          overwrite: true

      - name: Commit manifest, metrics and report to the data branch
        run: .github/scripts/publish-data.sh ${{ steps.src.outputs.date }}
